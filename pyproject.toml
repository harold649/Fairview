[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clover-qb"
version = "1.0.0"
description = "Daily Clover POS to QuickBooks Desktop Sales Receipt conversion for Adrenaline Fairview"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
pdf = ["PyMuPDF>=1.23"]
dev = ["pytest>=7", "openpyxl>=3.1"]

[project.scripts]
clover-qb = "clover_qb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
